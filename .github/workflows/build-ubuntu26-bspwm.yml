name: Build Ubuntu 26.04 + bspwm (Anland)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'aarch64'
        type: choice
        options:
          - aarch64
          - x86_64
      create_release:
        description: 'Publish to GitHub Releases'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve platform
        id: plat
        run: |
          case "${{ inputs.arch }}" in
            aarch64) echo "platform=linux/arm64" >> $GITHUB_OUTPUT ;;
            x86_64)  echo "platform=linux/amd64" >> $GITHUB_OUTPUT ;;
            *) echo "Unknown arch"; exit 1 ;;
          esac

      - name: Debug — cek ketersediaan paket
        run: |
          docker run --rm --platform ${{ steps.plat.outputs.platform }} ubuntu:26.04 \
            bash -c "apt-get update -qq && apt-cache policy systemd-sysv systemd libpam-systemd libegl-mesa0 | head -40"

      - name: Write Dockerfile
        run: |
          cat > Dockerfile <<'DOCKERFILE_EOF'
          # ============================================================
          # Ubuntu 26.04 + bspwm (minimal, no DE) for Droidspaces/Anland
          # Dengan systemd sebagai init (WAJIB untuk Droidspaces)
          # ============================================================
          FROM ubuntu:26.04 AS rootfs

          ENV DEBIAN_FRONTEND=noninteractive
          ENV LANG=en_US.UTF-8
          ENV LC_ALL=en_US.UTF-8
          ENV XDG_RUNTIME_DIR=/run/user/0
          ENV DISPLAY=:0

          # ---------- Base system + systemd (WAJIB) ----------
          RUN apt-get update && apt-get install -y --no-install-recommends \
                bash coreutils util-linux procps findutils grep sed gawk \
                ca-certificates curl wget gnupg \
                tzdata locales sudo nano less vim-tiny \
                dbus dbus-x11 \
                systemd systemd-sysv libpam-systemd \
                apt-utils \
              && rm -rf /var/lib/apt/lists/* \
              && locale-gen en_US.UTF-8

          # Pastikan /sbin/init menunjuk ke systemd
          RUN ls -la /sbin/init && \
              readlink -f /sbin/init && \
              test -x "$(readlink -f /sbin/init)"

          # ---------- X11 + bspwm stack (no DE) ----------
          RUN apt-get update && apt-get install -y --no-install-recommends \
                bspwm sxhkd \
                x11-xserver-utils x11-utils x11-xkb-utils xauth \
                xterm xdotool wmctrl xclip \
                picom \
                feh \
                rofi \
                xdg-user-dirs xdg-utils \
              && rm -rf /var/lib/apt/lists/*

          # ---------- Fonts ----------
          RUN apt-get update && apt-get install -y --no-install-recommends \
                fonts-dejavu-core fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji \
              && rm -rf /var/lib/apt/lists/*

          # ---------- Audio (PipeWire) ----------
          RUN apt-get update && apt-get install -y --no-install-recommends \
                pipewire pipewire-pulse wireplumber \
                pulseaudio-utils \
              && rm -rf /var/lib/apt/lists/*

          # ---------- GPU / Mesa (kgsl untuk Adreno) ----------
          RUN apt-get update && apt-get install -y --no-install-recommends \
                mesa-utils libgl1-mesa-dri libegl-mesa0 \
                libgles2 libgbm1 \
                vulkan-tools \
                wayland-utils \
              && rm -rf /var/lib/apt/lists/*

          # ---------- bspwm config ----------
          RUN mkdir -p /root/.config/bspwm /root/.config/sxhkd && \
              cat > /root/.config/bspwm/bspwmrc <<'BSPWM'
          #!/bin/sh
          bspc monitor -d I II III IV V VI VII VIII IX X
          bspc config border_width         2
          bspc config window_gap           8
          bspc config split_ratio          0.52
          bspc config borderless_monocle   true
          bspc config gapless_monocle      true
          bspc config focused_border_color "#4c7899"
          bspc config normal_border_color  "#2f343f"
          picom --backend xrender --daemon 2>/dev/null || true
          feh --bg-fill /usr/share/backgrounds/* 2>/dev/null || true
          BSPWM
          RUN chmod +x /root/.config/bspwm/bspwmrc

          RUN cat > /root/.config/sxhkd/sxhkdrc <<'SXHKD'
          super + Return
              xterm
          super + d
              rofi -show drun
          super + q
              bspc node -c
          super + Escape
              pkill -USR1 -x sxhkd; bspc quit
          super + {1-9,0}
              bspc desktop -f ^{1-9,10}
          super + shift + {1-9,0}
              bspc node -d ^{1-9,10}
          super + {t,m,s}
              bspc layout -d ^{tiled,monocle,spiral}
          SXHKD

          # ---------- Anland session wrapper ----------
          RUN cat > /usr/local/bin/bspwm-anland-session <<'SESSION'
          #!/usr/bin/env bash
          set -euo pipefail

          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          export ANLAND_RUNTIME_DIR="${ANLAND_RUNTIME_DIR:-/run/anland}"
          export MESA_LOADER_DRIVER_OVERRIDE="${MESA_LOADER_DRIVER_OVERRIDE:-kgsl}"
          export GALLIUM_DRIVER="${GALLIUM_DRIVER:-kgsl}"
          export FD_FORCE_KGSL="${FD_FORCE_KGSL:-1}"
          export DISPLAY="${DISPLAY:-:0}"

          for i in $(seq 1 60); do
              if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
                  echo "[bspwm-anland] Xwayland ready on $DISPLAY"
                  break
              fi
              sleep 0.5
          done

          if ! xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
              echo "[bspwm-anland] WARN: Xwayland not detected, waiting anyway..."
          fi

          exec bspwm -c /root/.config/bspwm/bspwmrc
          SESSION
          RUN chmod +x /usr/local/bin/bspwm-anland-session

          # ---------- systemd service ----------
          RUN cat > /etc/systemd/system/bspwm-anland.service <<'UNIT'
          [Unit]
          Description=bspwm on Anland (rootless Xwayland)
          After=network.target dbus.service
          Wants=dbus.service

          [Service]
          Type=simple
          Environment=HOME=/root
          Environment=DISPLAY=:0
          Environment=XDG_RUNTIME_DIR=/run/user/0
          Environment=ANLAND_RUNTIME_DIR=/run/anland
          Environment=MESA_LOADER_DRIVER_OVERRIDE=kgsl
          Environment=GALLIUM_DRIVER=kgsl
          Environment=FD_FORCE_KGSL=1
          ExecStart=/usr/local/bin/bspwm-anland-session
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNIT

          RUN systemctl enable bspwm-anland.service 2>/dev/null || \
              ln -sf /etc/systemd/system/bspwm-anland.service \
                     /etc/systemd/system/multi-user.target.wants/bspwm-anland.service

          # ---------- Cleanup ----------
          RUN apt-get clean && \
              rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /var/cache/apt/* \
                     /usr/share/doc/* /usr/share/man/* /usr/share/info/*

          # ---------- Export ----------
          FROM scratch AS export
          LABEL droidspaces.name="Ubuntu 26.04 + bspwm (Anland)"
          LABEL droidspaces.distro="Ubuntu"
          LABEL droidspaces.version="26.04"
          LABEL droidspaces.desktop="bspwm"
          LABEL droidspaces.backend="anland-wayland"
          LABEL droidspaces.entrypoint="/sbin/init"
          COPY --from=rootfs / /
          DOCKERFILE_EOF

          sed -i 's/^          //' Dockerfile
          echo "=== Dockerfile preview ==="
          head -30 Dockerfile

      - name: Build rootfs
        run: |
          mkdir -p out
          docker buildx build \
            --platform ${{ steps.plat.outputs.platform }} \
            --target export \
            --output type=tar,dest=out/rootfs.tar \
            -f Dockerfile .

      - name: Verify rootfs has /sbin/init
        run: |
          mkdir -p verify
          echo "=== Extracting full rootfs ==="
          tar -xf out/rootfs.tar -C verify

          echo ""
          echo "=== Struktur sbin & usr/sbin ==="
          ls -la verify/sbin 2>/dev/null | head -20 || echo "  (tidak ada /sbin)"
          echo "---"
          ls -la verify/usr/sbin 2>/dev/null | grep -E "init|systemd" || echo "  (tidak ada init di /usr/sbin)"

          echo ""
          echo "=== Cek beberapa lokasi umum ==="
          FOUND=""
          for p in sbin/init usr/sbin/init bin/init usr/bin/init; do
            if [ -L "verify/$p" ] || [ -e "verify/$p" ]; then
              echo "OK Ditemukan: $p"
              ls -la "verify/$p"
              FOUND="$p"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo ""
            echo "GAGAL: /sbin/init TIDAK ADA di lokasi manapun."
            echo "=== Semua file 'init' atau 'systemd' di rootfs ==="
            find verify -maxdepth 4 \( -name "init" -o -name "systemd" \) -print 2>/dev/null | head -30
            echo ""
            echo "=== Isi rootfs (level 1) ==="
            ls -la verify/
            exit 1
          fi

          if [ -L "verify/$FOUND" ]; then
            TARGET=$(readlink "verify/$FOUND")
            echo ""
            echo "Symlink: $FOUND -> $TARGET"
            ABS_TARGET="verify/${TARGET#/}"
            if [ -e "$ABS_TARGET" ]; then
              echo "OK Target symlink ada: $ABS_TARGET"
            else
              echo "GAGAL Target symlink TIDAK ADA: $ABS_TARGET"
              echo "   Rootfs rusak karena systemd-sysv tidak terinstall."
              exit 1
            fi
          fi

          echo ""
          echo "Verifikasi lulus: rootfs punya init system."

      - name: Compress
        run: |
          cd out
          echo "Raw size:"; ls -lh rootfs.tar
          xz -T0 -9 -k rootfs.tar
          mv rootfs.tar.xz ubuntu-26.04-bspwm-anland-${{ inputs.arch }}.tar.xz
          rm -f rootfs.tar
          echo "Final size:"; ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-26.04-bspwm-anland-${{ inputs.arch }}
          path: out/*.tar.xz
          retention-days: 30

      - name: Create Release
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubuntu-26.04-bspwm-anland-${{ inputs.arch }}-${{ github.run_number }}
          name: Ubuntu 26.04 bspwm + Anland (${{ inputs.arch }}) #${{ github.run_number }}
          files: out/*.tar.xz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
