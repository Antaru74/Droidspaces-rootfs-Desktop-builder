name: Build Ubuntu 26.04 + bspwm + Anland Next

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'aarch64'
        type: choice
        options:
          - aarch64
          - x86_64
      create_release:
        description: 'Publish to GitHub Releases'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve platform
        id: plat
        run: |
          case "${{ inputs.arch }}" in
            aarch64) echo "platform=linux/arm64" >> $GITHUB_OUTPUT ;;
            x86_64)  echo "platform=linux/amd64" >> $GITHUB_OUTPUT ;;
            *) echo "Unknown arch"; exit 1 ;;
          esac

      - name: Debug — cek ketersediaan paket
        run: |
          docker run --rm --platform ${{ steps.plat.outputs.platform }} ubuntu:26.04 \
            bash -c "apt-get update -qq && apt-cache policy systemd-sysv systemd libpam-systemd libegl-mesa0 bspwm sxhkd weston | head -60"

      - name: Write Dockerfile
        run: |
          cat > Dockerfile <<'DOCKERFILE_EOF'
          # ============================================================
          # Ubuntu 26.04 + bspwm nested in Anland Next session
          # anland-session = producer Anland (rootless Xwayland + mini-wm)
          # bspwm          = window manager, jalan DI DALAM Xwayland itu
          # ============================================================
          FROM ubuntu:26.04 AS rootfs

          ENV DEBIAN_FRONTEND=noninteractive
          ENV LANG=en_US.UTF-8
          ENV LC_ALL=en_US.UTF-8

          # ---------- Base system + systemd (WAJIB untuk Droidspaces) ----------
          RUN apt-get update && apt-get install -y --no-install-recommends \
                bash coreutils util-linux procps findutils grep sed gawk \
                ca-certificates curl wget gnupg xz-utils \
                tzdata locales sudo nano less vim-tiny \
                dbus dbus-x11 \
                systemd systemd-sysv libpam-systemd \
                apt-utils \
              && rm -rf /var/lib/apt/lists/* \
              && locale-gen en_US.UTF-8

          # Verifikasi /sbin/init
          RUN ls -la /sbin/init && \
              readlink -f /sbin/init && \
              test -x "$(readlink -f /sbin/init)"

          # ---------- X11 + bspwm stack ----------
          RUN apt-get update && apt-get install -y --no-install-recommends \
                bspwm sxhkd \
                x11-xserver-utils x11-utils x11-xkb-utils xauth \
                xterm xdotool wmctrl xclip \
                picom \
                feh \
                rofi \
                xdg-user-dirs xdg-utils \
              && rm -rf /var/lib/apt/lists/*

          # ---------- Fonts ----------
          RUN apt-get update && apt-get install -y --no-install-recommends \
                fonts-dejavu-core fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji \
              && rm -rf /var/lib/apt/lists/*

          # ---------- Audio (PipeWire) ----------
          RUN apt-get update && apt-get install -y --no-install-recommends \
                pipewire pipewire-pulse wireplumber \
                pulseaudio-utils \
              && rm -rf /var/lib/apt/lists/*

          # ---------- GPU / Mesa (kgsl untuk Adreno) ----------
          RUN apt-get update && apt-get install -y --no-install-recommends \
                mesa-utils libgl1-mesa-dri libegl-mesa0 \
                libgles2 libgbm1 \
                vulkan-tools \
                wayland-utils \
              && rm -rf /var/lib/apt/lists/*

          # ---------- Install anland-session dari droidspaces-package ----------
          # anland-session menyediakan: socket link, rootless Xwayland, mini-wm
          # Ganti URL di bawah sesuai release terbaru dari:
          # https://github.com/Goldzxcbug/droidspaces-package/releases
          ARG ANLAND_SESSION_URL="https://github.com/Goldzxcbug/droidspaces-package/releases/latest/download/anland-next-ubuntu26-arm64.tar.gz"
          RUN curl -fsSL "$ANLAND_SESSION_URL" -o /tmp/anland-session.tar.gz && \
              tar -xzf /tmp/anland-session.tar.gz -C / && \
              rm /tmp/anland-session.tar.gz && \
              test -x /usr/bin/anland-session && \
              echo "anland-session installed OK"

          # ---------- bspwm config ----------
          RUN mkdir -p /root/.config/bspwm /root/.config/sxhkd && \
              cat > /root/.config/bspwm/bspwmrc <<'BSPWM'
          #!/bin/sh
          bspc monitor -d I II III IV V VI VII VIII IX X
          bspc config border_width         2
          bspc config window_gap           8
          bspc config split_ratio          0.52
          bspc config borderless_monocle   true
          bspc config gapless_monocle      true
          bspc config focused_border_color "#4c7899"
          bspc config normal_border_color  "#2f343f"
          picom --backend xrender --daemon 2>/dev/null || true
          feh --bg-fill /usr/share/backgrounds/* 2>/dev/null || true
          BSPWM
          RUN chmod +x /root/.config/bspwm/bspwmrc

          RUN cat > /root/.config/sxhkd/sxhkdrc <<'SXHKD'
          super + Return
              xterm
          super + d
              rofi -show drun
          super + q
              bspc node -c
          super + Escape
              pkill -USR1 -x sxhkd; bspc quit
          super + {1-9,0}
              bspc desktop -f ^{1-9,10}
          super + shift + {1-9,0}
              bspc node -d ^{1-9,10}
          super + {t,m,s}
              bspc layout -d ^{tiled,monocle,spiral}
          SXHKD

          # ---------- Environment Anland ----------
          RUN cat > /etc/environment <<'ENVFILE'
          XDG_RUNTIME_DIR=/run/user/0
          XCURSOR_SIZE=48
          WAYLAND_DISPLAY=wayland-0
          QT_QPA_PLATFORM=wayland
          ANLAND=1
          ANLAND_SOCKET=/run/display.sock
          ANLAND_DRM_DEVICE=/dev/dri/renderD128
          MESA_LOADER_DRIVER_OVERRIDE=kgsl
          GALLIUM_DRIVER=kgsl
          FD_FORCE_KGSL=1
          ENVFILE

          # ---------- Service 1: anland-session (producer Anland) ----------
          RUN cat > /etc/systemd/system/anland-session.service <<'UNIT'
          [Unit]
          Description=Anland Next Session (rootless Xwayland producer)
          After=network.target dbus.service
          Wants=dbus.service

          [Service]
          Type=simple
          Environment=HOME=/root
          Environment=XDG_RUNTIME_DIR=/run/user/0
          Environment=XCURSOR_SIZE=48
          Environment=WAYLAND_DISPLAY=wayland-0
          Environment=QT_QPA_PLATFORM=wayland
          Environment=ANLAND=1
          Environment=ANLAND_SOCKET=/run/display.sock
          Environment=ANLAND_DRM_DEVICE=/dev/dri/renderD128
          Environment=MESA_LOADER_DRIVER_OVERRIDE=kgsl
          Environment=GALLIUM_DRIVER=kgsl
          Environment=FD_FORCE_KGSL=1
          ExecStart=/usr/bin/anland-session
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNIT

          RUN systemctl enable anland-session.service 2>/dev/null || \
              ln -sf /etc/systemd/system/anland-session.service \
                     /etc/systemd/system/multi-user.target.wants/anland-session.service

          # ---------- Wrapper bspwm nested ----------
          RUN cat > /usr/local/bin/bspwm-nested-session <<'SESSION'
          #!/usr/bin/env bash
          set -euo pipefail

          export XDG_RUNTIME_DIR=/run/user/0
          export DISPLAY=:0
          export HOME=/root
          export MESA_LOADER_DRIVER_OVERRIDE=kgsl
          export GALLIUM_DRIVER=kgsl
          export FD_FORCE_KGSL=1

          # Tunggu Xwayland dari anland-session (maks 90 detik)
          for i in $(seq 1 180); do
              if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
                  echo "[bspwm-nested] Xwayland ready on $DISPLAY"
                  break
              fi
              sleep 0.5
          done

          if ! xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
              echo "[bspwm-nested] FATAL: Xwayland dari anland-session tidak muncul."
              echo "Cek: systemctl status anland-session"
              echo "     journalctl -u anland-session -n 100"
              exit 1
          fi

          # Jalankan bspwm di dalam Xwayland milik anland-session
          exec bspwm -c /root/.config/bspwm/bspwmrc
          SESSION
          RUN chmod +x /usr/local/bin/bspwm-nested-session

          # ---------- Service 2: bspwm nested (depends on anland-session) ----------
          RUN cat > /etc/systemd/system/bspwm-nested.service <<'UNIT'
          [Unit]
          Description=bspwm nested in Anland Next Xwayland
          After=anland-session.service
          Requires=anland-session.service
          PartOf=anland-session.service

          [Service]
          Type=simple
          Environment=HOME=/root
          Environment=DISPLAY=:0
          Environment=XDG_RUNTIME_DIR=/run/user/0
          Environment=MESA_LOADER_DRIVER_OVERRIDE=kgsl
          Environment=GALLIUM_DRIVER=kgsl
          Environment=FD_FORCE_KGSL=1
          ExecStart=/usr/local/bin/bspwm-nested-session
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          UNIT

          RUN systemctl enable bspwm-nested.service 2>/dev/null || \
              ln -sf /etc/systemd/system/bspwm-nested.service \
                     /etc/systemd/system/multi-user.target.wants/bspwm-nested.service

          # ---------- Cleanup ----------
          RUN apt-get clean && \
              rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /var/cache/apt/* \
                     /usr/share/doc/* /usr/share/man/* /usr/share/info/*

          # ---------- Export ----------
          FROM scratch AS export
          LABEL droidspaces.name="Ubuntu 26.04 + bspwm (Anland Next)"
          LABEL droidspaces.distro="Ubuntu"
          LABEL droidspaces.version="26.04"
          LABEL droidspaces.desktop="bspwm"
          LABEL droidspaces.backend="anland-wayland"
          LABEL droidspaces.entrypoint="/sbin/init"
          COPY --from=rootfs / /
          DOCKERFILE_EOF

          sed -i 's/^          //' Dockerfile
          echo "=== Dockerfile preview ==="
          head -40 Dockerfile
          echo "..."
          echo "=== Cek service anland-session & bspwm ==="
          grep -n "anland-session\|bspwm-nested\|libegl-mesa0\|/sbin/init" Dockerfile

      - name: Build rootfs
        run: |
          mkdir -p out
          docker buildx build \
            --platform ${{ steps.plat.outputs.platform }} \
            --target export \
            --output type=tar,dest=out/rootfs.tar \
            -f Dockerfile .

      - name: Verify rootfs
        run: |
          mkdir -p verify
          echo "=== Extracting full rootfs ==="
          tar -xf out/rootfs.tar -C verify

          echo ""
          echo "=== Cek /sbin/init ==="
          if [ ! -L verify/sbin/init ] && [ ! -e verify/sbin/init ]; then
            echo "GAGAL: /sbin/init tidak ada."
            ls -la verify/sbin/ 2>/dev/null | head -20
            exit 1
          fi
          ls -la verify/sbin/init

          echo ""
          echo "=== Resolve symlink chain ==="
          RESOLVED=$(readlink -f verify/sbin/init)
          echo "Resolved: $RESOLVED"
          if [ ! -e "$RESOLVED" ]; then
            echo "GAGAL: target symlink tidak ada: $RESOLVED"
            exit 1
          fi
          if [ ! -x "$RESOLVED" ]; then
            echo "GAGAL: target tidak executable: $RESOLVED"
            exit 1
          fi
          echo "OK systemd binary:"
          ls -la "$RESOLVED"

          echo ""
          echo "=== Cek anland-session binary ==="
          if [ ! -x verify/usr/bin/anland-session ]; then
            echo "GAGAL: /usr/bin/anland-session tidak ada atau tidak executable."
            echo "Isi /usr/bin yang mengandung 'anland':"
            ls -la verify/usr/bin/ 2>/dev/null | grep -i anland || echo "  (tidak ada)"
            exit 1
          fi
          ls -la verify/usr/bin/anland-session

          echo ""
          echo "=== Cek service anland-session ==="
          if [ -L verify/etc/systemd/system/multi-user.target.wants/anland-session.service ] || \
             [ -e verify/etc/systemd/system/multi-user.target.wants/anland-session.service ]; then
            echo "OK anland-session.service enabled"
          else
            echo "PERINGATAN: anland-session.service tidak enabled"
          fi

          echo ""
          echo "=== Cek service bspwm-nested ==="
          if [ -L verify/etc/systemd/system/multi-user.target.wants/bspwm-nested.service ] || \
             [ -e verify/etc/systemd/system/multi-user.target.wants/bspwm-nested.service ]; then
            echo "OK bspwm-nested.service enabled"
          else
            echo "PERINGATAN: bspwm-nested.service tidak enabled"
          fi

          echo ""
          echo "=== Cek bspwm binary ==="
          if [ ! -x verify/usr/bin/bspwm ]; then
            echo "GAGAL: bspwm tidak ada."
            exit 1
          fi
          ls -la verify/usr/bin/bspwm

          echo ""
          echo "Verifikasi lulus: rootfs siap untuk Anland Next + bspwm."

      - name: Compress
        run: |
          cd out
          echo "Raw size:"; ls -lh rootfs.tar
          xz -T0 -9 -k rootfs.tar
          mv rootfs.tar.xz ubuntu-26.04-bspwm-anland-next-${{ inputs.arch }}.tar.xz
          rm -f rootfs.tar
          echo "Final size:"; ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-26.04-bspwm-anland-next-${{ inputs.arch }}
          path: out/*.tar.xz
          retention-days: 30

      - name: Create Release
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubuntu-26.04-bspwm-anland-next-${{ inputs.arch }}-${{ github.run_number }}
          name: Ubuntu 26.04 bspwm + Anland Next (${{ inputs.arch }}) #${{ github.run_number }}
          files: out/*.tar.xz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
